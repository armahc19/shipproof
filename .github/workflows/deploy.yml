name: Deploy ShipProof

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Debug Secrets
        run: |
          echo "VPS_HOST length      : ${{ secrets.VPS_HOST != '' }}"
          echo "VPS_USER length      : ${{ secrets.VPS_USER != '' }}"
          echo "SSH_PRIVATE_KEY length: ${{ secrets.SSH_PRIVATE_KEY != '' }}"

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master        # ← Updated to latest
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 15m
          script: |
            echo "🚀 DEPLOY START"
            cd ~/production-projects/apps/shipproof || exit 1

            echo "📌 Current commit BEFORE:"
            git rev-parse HEAD

            echo "🔄 Fetching latest..."
            git fetch origin main

            echo "📥 Resetting to origin/main..."
            git reset --hard origin/main

            echo "📌 Current commit AFTER:"
            git rev-parse HEAD

            echo "🧹 Rebuilding containers..."
            docker-compose down
            docker-compose build --no-cache
            docker-compose up -d

            echo "✅ DEPLOY COMPLETE"